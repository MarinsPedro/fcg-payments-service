apiVersion: batch/v1
kind: Job
metadata:
  name: payments-migrations
  namespace: fcg
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: payments-migrations
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: postgres:17
          command:
            - sh
            - -c
            - >-
              until pg_isready -h postgres -p 5432 -U fcg_payments_app -d fcg_payments;
              do echo waiting for payments database; sleep 3; done
      containers:
        - name: migrations
          image: fcg-payments-migrations:local
          imagePullPolicy: IfNotPresent
          env:
            - name: DOTNET_ENVIRONMENT
              value: Development
            - name: PAYMENTS_MIGRATIONS_CONNECTION
              valueFrom:
                secretKeyRef:
                  name: fcg-dev-secrets
                  key: payments-connection-string
